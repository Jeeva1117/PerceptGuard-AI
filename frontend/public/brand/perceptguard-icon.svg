<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050B14" />
    </linearGradient>

    <!-- Outer Protective Border Glow -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="80%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Perception Radar Cone -->
    <linearGradient id="radarBeam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.0" />
    </linearGradient>

    <!-- Car Body Metallic Gradient -->
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <!-- Windshield Reflection -->
    <linearGradient id="windshield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Headlight Cyan Beam -->
    <linearGradient id="headlightGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <!-- Road Surface Gradient -->
    <linearGradient id="roadSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Soft Filter Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Geometric Outer Shield -->
  <path d="M 256 36 L 436 108 C 436 290 354 408 256 476 C 158 408 76 290 76 108 Z"
        fill="url(#shieldBg)"
        stroke="url(#shieldBorder)"
        stroke-width="12"
        stroke-linejoin="round" />

  <!-- Inner Subtle Inset Shield Rim -->
  <path d="M 256 56 L 416 122 C 416 276 342 382 256 448 C 170 382 96 276 96 122 Z"
        fill="none"
        stroke="#0284C7"
        stroke-width="2"
        stroke-opacity="0.3" />

  <!-- 2. Perspective Road Corridor -->
  <polygon points="172,434 236,252 276,252 340,434"
           fill="url(#roadSurface)" />

  <!-- Road Lateral Guidance Borders -->
  <line x1="172" y1="434" x2="236" y2="252" stroke="#0284C7" stroke-width="4" stroke-opacity="0.6" />
  <line x1="340" y1="434" x2="276" y2="252" stroke="#0284C7" stroke-width="4" stroke-opacity="0.6" />

  <!-- Dashed Center Lane Marking -->
  <line x1="256" y1="428" x2="256" y2="390" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="368" x2="256" y2="338" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="320" x2="256" y2="296" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="256" y1="282" x2="256" y2="264" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

  <!-- 3. Computer Vision & Perception Cone -->
  <polygon points="256,238 126,82 386,82"
           fill="url(#radarBeam)" />

  <!-- Horizon Wave Arcs (H1, H3, H5 Predictive Horizons) -->
  <path d="M 166 120 Q 256 82 346 120"
        fill="none"
        stroke="#38BDF8"
        stroke-width="3"
        stroke-linecap="round"
        stroke-dasharray="8 6"
        opacity="0.85"
        filter="url(#cyanGlow)" />
  <path d="M 188 152 Q 256 122 324 152"
        fill="none"
        stroke="#06B6D4"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-dasharray="6 5"
        opacity="0.7" />
  <path d="M 210 184 Q 256 160 302 184"
        fill="none"
        stroke="#0EA5E9"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.6" />

  <!-- Aperture / Crosshair Center Focus -->
  <circle cx="256" cy="116" r="16" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.9" />
  <circle cx="256" cy="116" r="4" fill="#38BDF8" filter="url(#cyanGlow)" />
  <line x1="256" y1="94" x2="256" y2="102" stroke="#22D3EE" stroke-width="2" />
  <line x1="256" y1="130" x2="256" y2="138" stroke="#22D3EE" stroke-width="2" />
  <line x1="234" y1="116" x2="242" y2="116" stroke="#22D3EE" stroke-width="2" />
  <line x1="270" y1="116" x2="278" y2="116" stroke="#22D3EE" stroke-width="2" />

  <!-- 4. Modern Autonomous Vehicle Silhouette -->
  <!-- Rooftop Perception Sensor Housing (LiDAR Pod) -->
  <rect x="246" y="234" width="20" height="7" rx="3.5" fill="#38BDF8" filter="url(#cyanGlow)" />
  <circle cx="256" cy="237.5" r="2.5" fill="#FFFFFF" />

  <!-- Vehicle Greenhouse / Roof & Windows -->
  <path d="M 224 266 L 235 244 C 237 241 241 240 245 240 L 267 240 C 271 240 275 241 277 244 L 288 266 Z"
        fill="url(#windshield)"
        stroke="#38BDF8"
        stroke-width="1.5" />

  <!-- Aerodynamic Vehicle Body Structure -->
  <path d="M 206 288 
           C 208 274 216 268 226 266
           L 286 266
           C 296 268 304 274 306 288
           C 307 296 304 308 301 316
           L 211 316
           C 208 308 205 296 206 288 Z"
        fill="url(#carBody)"
        stroke="#38BDF8"
        stroke-width="2.5" />

  <!-- Front Grille & Aerodynamic Air Dam -->
  <path d="M 217 312 L 295 312 L 290 326 L 222 326 Z"
        fill="#082F49"
        stroke="#0284C7"
        stroke-width="1.5" />

  <!-- Cybernetic Front Headlight / LED Lightbar Signature -->
  <path d="M 212 288 L 236 290 L 236 294 L 214 293 Z" fill="url(#headlightGlow)" filter="url(#cyanGlow)" />
  <path d="M 300 288 L 276 290 L 276 294 L 298 293 Z" fill="url(#headlightGlow)" filter="url(#cyanGlow)" />
  <line x1="238" y1="291" x2="274" y2="291" stroke="#38BDF8" stroke-width="2" opacity="0.8" />

  <!-- Wheels / Tires Silhouette -->
  <rect x="200" y="300" width="10" height="26" rx="4" fill="#030712" stroke="#1E293B" stroke-width="1.5" />
  <rect x="302" y="300" width="10" height="26" rx="4" fill="#030712" stroke="#1E293B" stroke-width="1.5" />
</svg>
