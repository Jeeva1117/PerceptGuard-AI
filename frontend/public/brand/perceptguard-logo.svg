<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050B14" />
    </linearGradient>

    <!-- Outer Protective Border Glow -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="80%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Radar Beam -->
    <linearGradient id="radarBeam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.0" />
    </linearGradient>

    <!-- Car Body -->
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <!-- Windshield -->
    <linearGradient id="windshield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.25" />
    </linearGradient>

    <!-- AI Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== LEFT: BRAND SHIELD ICON ==================== -->
  <g transform="translate(24, 18) scale(0.32)">
    <!-- 1. Outer Geometric Shield -->
    <path d="M 256 36 L 436 108 C 436 290 354 408 256 476 C 158 408 76 290 76 108 Z"
          fill="url(#shieldBg)"
          stroke="url(#shieldBorder)"
          stroke-width="16"
          stroke-linejoin="round" />

    <!-- 2. Road Corridor -->
    <polygon points="172,434 236,252 276,252 340,434" fill="#1E293B" opacity="0.8" />
    <line x1="172" y1="434" x2="236" y2="252" stroke="#0284C7" stroke-width="5" />
    <line x1="340" y1="434" x2="276" y2="252" stroke="#0284C7" stroke-width="5" />
    <line x1="256" y1="428" x2="256" y2="390" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
    <line x1="256" y1="368" x2="256" y2="338" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
    <line x1="256" y1="320" x2="256" y2="296" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

    <!-- 3. Radar Perception Cone -->
    <polygon points="256,238 126,82 386,82" fill="url(#radarBeam)" />
    <path d="M 166 120 Q 256 82 346 120" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="8 6" filter="url(#cyanGlow)" />
    <path d="M 188 152 Q 256 122 324 152" fill="none" stroke="#06B6D4" stroke-width="3.5" stroke-dasharray="6 5" />
    <path d="M 210 184 Q 256 160 302 184" fill="none" stroke="#0EA5E9" stroke-width="3" />

    <!-- Reticle Aperture -->
    <circle cx="256" cy="116" r="16" fill="none" stroke="#22D3EE" stroke-width="3" />
    <circle cx="256" cy="116" r="5" fill="#38BDF8" />

    <!-- 4. Automotive Silhouette -->
    <rect x="246" y="234" width="20" height="7" rx="3.5" fill="#38BDF8" />
    <path d="M 224 266 L 235 244 C 237 241 241 240 245 240 L 267 240 C 271 240 275 241 277 244 L 288 266 Z" fill="url(#windshield)" stroke="#38BDF8" stroke-width="2" />
    <path d="M 206 288 C 208 274 216 268 226 266 L 286 266 C 296 268 304 274 306 288 C 307 296 304 308 301 316 L 211 316 C 208 308 205 296 206 288 Z" fill="url(#carBody)" stroke="#38BDF8" stroke-width="3" />
    <path d="M 217 312 L 295 312 L 290 326 L 222 326 Z" fill="#082F49" stroke="#0284C7" stroke-width="2" />
    <!-- LED Headlights -->
    <path d="M 212 288 L 236 290 L 236 294 L 214 293 Z" fill="#67E8F9" filter="url(#cyanGlow)" />
    <path d="M 300 288 L 276 290 L 276 294 L 298 293 Z" fill="#67E8F9" filter="url(#cyanGlow)" />
    <line x1="238" y1="291" x2="274" y2="291" stroke="#38BDF8" stroke-width="2.5" />
    <rect x="200" y="300" width="10" height="26" rx="4" fill="#030712" />
    <rect x="302" y="300" width="10" height="26" rx="4" fill="#030712" />
  </g>

  <!-- ==================== RIGHT: LOGO TYPOGRAPHY ==================== -->
  <g transform="translate(200, 0)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="104"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
          font-size="62"
          font-weight="900"
          letter-spacing="0.5px">
      <tspan fill="#F8FAFC">PERCEPT</tspan>
      <tspan fill="#38BDF8">GUARD</tspan>
    </text>

    <!-- AI Distinction Badge -->
    <g transform="translate(488, 52)">
      <rect x="0" y="0" width="86" height="52" rx="14" fill="url(#badgeGrad)" />
      <rect x="1.5" y="1.5" width="83" height="49" rx="12.5" fill="#090D16" />
      <text x="43" y="36"
            font-family="system-ui, -apple-system, sans-serif"
            font-size="28"
            font-weight="900"
            fill="#38BDF8"
            text-anchor="middle"
            letter-spacing="2px"
            filter="url(#cyanGlow)">AI</text>
    </g>

    <!-- Sleek Tech Divider Bar -->
    <line x1="0" y1="126" x2="574" y2="126" stroke="#334155" stroke-width="2" />
    <line x1="0" y1="126" x2="160" y2="126" stroke="#06B6D4" stroke-width="2.5" />

    <!-- Official Brand Tagline -->
    <text x="0" y="156"
          font-family="system-ui, -apple-system, 'SF Mono', Consolas, 'Courier New', monospace"
          font-size="14.5"
          font-weight="700"
          letter-spacing="2.2px"
          fill="#94A3B8">
      SEE THE ROAD <tspan fill="#38BDF8">•</tspan> PREDICT THE RISK <tspan fill="#38BDF8">•</tspan> PREVENT THE COLLISION
    </text>
  </g>
</svg>
