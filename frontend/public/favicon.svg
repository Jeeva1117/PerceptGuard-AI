<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M 32 4 L 56 14 C 56 40 45 54 32 60 C 19 54 8 40 8 14 Z"
        fill="url(#favShield)"
        stroke="url(#favBorder)"
        stroke-width="3.5"
        stroke-linejoin="round" />

  <!-- Road Corridor -->
  <polygon points="21,55 29,32 35,32 43,55" fill="#0F172A" />
  <line x1="21" y1="55" x2="29" y2="32" stroke="#0284C7" stroke-width="2" />
  <line x1="43" y1="55" x2="35" y2="32" stroke="#0284C7" stroke-width="2" />
  <line x1="32" y1="53" x2="32" y2="46" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="42" x2="32" y2="36" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />

  <!-- Radar Arc (Computer Vision Perception) -->
  <path d="M 20 18 Q 32 12 44 18" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="18" r="2.5" fill="#22D3EE" />

  <!-- Autonomous Vehicle Front Silhouette -->
  <!-- LiDAR Pod -->
  <rect x="30" y="30" width="4" height="2" rx="1" fill="#38BDF8" />
  <!-- Windshield -->
  <polygon points="27,35 29,32 35,32 37,35" fill="#E0F2FE" />
  <!-- Body & Headlights -->
  <rect x="25" y="35" width="14" height="6" rx="2" fill="#0284C7" />
  <line x1="26" y1="38" x2="29" y2="38" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" />
  <line x1="35" y1="38" x2="38" y2="38" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" />
</svg>
