# PerceptGuard AI — Early Warning & Risk Assessment Configuration
# Day 10: Predictive Early Warning & Risk Assessment System
# Hardware Target: Intel Core i3 (CPU-Only), 8 GB RAM, Windows 11

project:
  name: PerceptGuard AI
  stage: early_warning
  random_seed: 42

runtime:
  device: cpu
  num_threads: 2
  deterministic: true
  max_memory_rss_mb: 512

forecast_horizons:
  supported: [1, 3, 5]
  default_horizon: 3
  weights:
    h1: 0.50
    h3: 0.35
    h5: 0.15

risk_classification:
  levels:
    - LOW
    - MEDIUM
    - HIGH
    - CRITICAL
  # Provisional threshold bounds to be calibrated on validation data in Day 10 Task 3
  provisional_thresholds:
    low_upper: 0.30
    medium_upper: 0.60
    high_upper: 0.85
  boundary_policy: closed_right
  missing_data_level: UNKNOWN

temporal_monitoring:
  sliding_window_size: 5
  min_consecutive_alerts: 2
  alert_debounce_frames: 3
  degradation_slope_threshold: -0.10
  trend_history_length: 5

alert_generation:
  cooldown_frames: 5
  suppress_redundant: true
  enable_critical_escalation: true
  max_active_alerts: 10
  notification_channels:
    - log
    - dashboard_event

data_ingestion:
  prediction_freshness_max_ms: 1000.0
  allow_missing_horizons: true
  require_timestamp: true
  validation_mode: strict

logging:
  level: INFO
  log_predictions: true
  log_risk_scores: true
  log_warnings: true
