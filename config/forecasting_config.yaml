# PerceptGuard AI - Forecasting Configuration
# Day 6: Predictive Perception Reliability Forecasting
# CPU-first deep learning forecasting environment

project:
  name: PerceptGuard AI
  stage: forecasting
  random_seed: 42

runtime:
  device: cpu
  num_threads: 2
  deterministic: true

data:
  sequence_directory: datasets/processed
  sequence_lengths: [5, 10, 15, 20]
  forecast_horizons: [1, 3, 5]
  batch_size: 8
  num_workers: 0

model:
  architecture: lstm
  input_size: auto
  hidden_size: 32
  num_layers: 1
  dropout: 0.0
  output_horizons: [1, 3, 5]

training:
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 50
  early_stopping_patience: 8

evaluation:
  metrics:
    - mae
    - rmse

artifacts:
  checkpoint_directory: models/forecasting
  experiment_directory: experiments/forecasting
