# PerceptGuard-AI: Video Ingestion, Extraction, and Preprocessing Configuration

video:
  input_directory: datasets/raw
  supported_extensions:
    - .mp4
    - .avi
    - .mov
    - .mkv
  default_video: datasets/raw/converted_026c7465-309f6d33.mp4
  validation:
    min_fps: 1.0
    max_fps: 120.0
    min_frames: 1
    min_width: 64
    min_height: 64

frame_extraction:
  output_directory: datasets/processed/driving_sample/frames
  extraction_fps: 5.0
  max_frames: 300
  image_format: jpg
  filename_prefix: frame_
  filename_padding: 6
  jpeg_quality: 95
  overwrite: true

preprocessing:
  input_directory: datasets/processed/driving_sample/frames
  output_directory: datasets/processed/driving_sample/preprocessed_frames
  target_width: 640
  target_height: 360
  preserve_aspect_ratio: true
  padding_color: [0, 0, 0]
  color_mode: BGR
  image_format: jpg
  jpeg_quality: 95
  calculate_blur: true
  calculate_brightness: true
  calculate_contrast: true
  blur_threshold: null
  brightness_threshold_low: 40.0
  brightness_threshold_high: 220.0
  overwrite: true

dataset:
  dataset_id: driving_sample
  root_directory: datasets
  raw_directory: datasets/raw
  processed_directory: datasets/processed/driving_sample
  extracted_frames_directory: datasets/processed/driving_sample/frames
  preprocessed_frames_directory: datasets/processed/driving_sample/preprocessed_frames
  metadata_csv: datasets/processed/driving_sample/metadata.csv
  summary_json: datasets/processed/driving_sample/summary.json
  manifest_json: datasets/processed/driving_sample/dataset_manifest.json
