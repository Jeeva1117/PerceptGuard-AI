schema_version: "1.0.0"

metadata:
  specification_name: "PerceptGuard-AI Detection Reliability Labeling Specification"
  created_at: "2026-11-20T07:50:00+00:00"
  stage: "reliability_label_design"
  license_reference: "UC Berkeley Regents Academic / Research License"

matching:
  strategy: "class_aware_bipartite"  # "class_aware_bipartite" (Hungarian) or "greedy_descending_iou"
  iou_threshold: 0.50                # Standard spatial overlap threshold
  alternative_iou_thresholds: [0.30, 0.40, 0.50, 0.60, 0.70]
  class_aware: true                  # Enforces class(pred) == class(gt)
  min_detection_confidence: 0.25     # YOLO prediction confidence threshold
  min_box_area_pixels: 4.0          # Minimum valid bounding box area
  handle_duplicates: "false_positive" # Highest IoU match is TP; redundant predictions become FP

object_level_labels:
  target_field: "object_detection_correctness"
  true_positive_value: 1.0
  false_positive_value: 0.0
  classes_evaluated:
    - "car"
    - "truck"
    - "bus"
    - "person"
    - "motorcycle"
    - "bicycle"
    - "traffic light"
    - "train"

frame_level_reliability:
  primary_metric: "f1_score"         # Primary continuous target R_t in [0.0, 1.0]
  alternative_metrics:
    - "precision"
    - "recall"
    - "mean_iou"
    - "composite_reliability"
  composite_formulation:
    f1_weight: 0.70
    mean_iou_weight: 0.30
  empty_frame_policy:
    both_empty: 1.0                  # Correct negative scene -> perfect reliability
    predictions_only: 0.0            # Phantom predictions / pure false alarms -> zero reliability
    ground_truth_only: 0.0           # Complete detection failure / missed objects -> zero reliability
    zero_matches: 0.0                # Both non-empty but zero true positives -> zero reliability

temporal_horizons:
  horizons: [1, 3, 5]
  frame_rate_fps: 5.0
  time_offsets_seconds: [0.20, 0.60, 1.00]
  target_formulation: "exact_future_frame" # Primary: R_{t+h} at exact future frame
  alternative_formulations:
    - "window_minimum"               # Worst-case reliability across interval [t+1, t+h]
    - "window_mean"                  # Average reliability across interval [t+1, t+h]
  missing_future_frame_policy: "quarantine"
  out_of_bounds_policy: "mask"

data_contracts:
  input_ground_truth: "datasets/processed/driving_sample/annotations/ground_truth_annotations.json"
  input_detections: "datasets/processed/driving_sample/detections/batch_runs/run_20261117_115348_e1789b/detection_results.json"
  input_tracking: "datasets/processed/driving_sample/tracking/multi_object/mot_driving_sample_20261117_160903_1c98f4/multi_object_tracking.json"
  output_directory: "datasets/processed/driving_sample/reliability_labels"
  output_files:
    object_labels: "object_detection_labels.json"
    frame_labels: "frame_reliability_labels.json"
    temporal_targets: "temporal_reliability_targets.json"
    matching_manifest: "reliability_manifest.json"

scientific_validation:
  leakage_prevention: "chronological_purged"
  temporal_gap_frames: 25
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  sensitivity_analysis_enabled: true
