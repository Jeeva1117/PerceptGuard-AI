# ==============================================================================
# PerceptGuard-AI: YOLO Object Detection Environment & Model Configuration
# ==============================================================================

yolo:
  model_name: "yolo11n"
  model_weights_path: "models/yolo/yolo11n.pt"
  task: "detect"
  device: "cpu"
  image_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.45
  max_detections: 100
  half_precision: false
  verbose: false

validation:
  min_confidence: 0.01
  max_confidence: 1.0
  min_iou: 0.01
  max_iou: 1.0
  min_image_size: 32
  max_image_size: 1920
  supported_tasks:
    - "detect"
  supported_devices:
    - "cpu"
  supported_models:
    - "yolo11n"
    - "yolo11s"
    - "yolov8n"
    - "yolov8s"

